<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kitchen Productivity — NS Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #6f7275;
    --panel: #5d6063;
    --panel-2: #686b6f;
    --line: #868a8d;
    --paper: #f2ecdd;
    --paper-2: #e6dfc9;
    --ink: #21201a;
    --steel: #f2f3f4;
    --c-carb:   #e0ac57;
    --c-veg:    #79bb6d;
    --c-prot:   #cb5c46;
    --c-sauce:  #dd8140;
    --accent:   #ffd35c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--steel);
    font-family:'IBM Plex Mono', monospace;
    padding: 24px 14px 60px;
  }
  .wrap{ max-width: 720px; margin:0 auto; }
  h1{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:3px;
    font-size: 40px;
    color:#f2ecdd;
    margin: 0 0 2px;
  }
  .sub{
    font-size:12px;
    letter-spacing:2px;
    color: var(--steel);
    text-transform:uppercase;
    margin-bottom:20px;
    border-bottom: 1px dashed var(--line);
    padding-bottom:14px;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  label{
    display:block; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:#7c8b82; margin-bottom:6px;
  }
  select, input[type="number"], input[type="text"], textarea{
    width:100%; background:var(--panel-2); color:#f2ecdd;
    border:1px solid var(--line); border-radius:6px;
    padding:10px; font-family:'IBM Plex Mono', monospace; font-size:14px;
    margin-bottom:14px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  label[for=""], #comentarioLabel{
    color: var(--accent) !important;
  }
  #comentario{
    border:1px solid var(--accent);
    color:#fff8e6;
  }
  #comentario::placeholder{ color:#b8b09a; }

  .meals-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:14px;}
  .meals-grid button{
    padding:8px 2px; font-size:12px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--steel);
    cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .meals-grid button.active{ background:#f2ecdd; color:var(--ink); border-color:#f2ecdd; font-weight:600;}
  .meals-grid button:disabled{ opacity:.35; cursor:not-allowed; }

  .menu-title{
    font-family:'Bebas Neue', sans-serif; font-size:24px; letter-spacing:1.5px;
    color:#f2ecdd; margin: 4px 0 12px;
  }

  .item-row{
    padding:10px 0; border-bottom:1px dashed var(--line);
  }
  .item-top{
    display:grid; grid-template-columns: 34px 1fr 100px; gap:10px;
    align-items:center;
  }
  .badge{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff;
  }
  .badge.C{ background: var(--c-carb); }
  .badge.V{ background: var(--c-veg); }
  .badge.P{ background: var(--c-prot); }
  .badge.S{ background: var(--c-sauce); }
  .item-name{ font-size:13.5px; color:#f2ecdd; }
  .item-row input[type="number"]{ margin:0; text-align:right; padding:8px 6px;}

  .prep-row{
    display:grid; grid-template-columns: repeat(3,1fr); gap:8px;
    margin:8px 0 0 44px;
  }
  .prep-check{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:7px 4px; font-size:11px; letter-spacing:1px; color:var(--accent);
    text-transform:uppercase; font-weight:600; cursor:pointer; margin:0;
  }
  .prep-check input[type="checkbox"]{
    width:15px; height:15px; accent-color: var(--accent); cursor:pointer;
  }
  .prep-check:has(input:checked){ background: var(--accent); color:var(--ink); border-color:var(--accent); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; font-size:11px; margin-bottom:16px; }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend i{ width:12px; height:12px; border-radius:50%; display:inline-block; }

  .submit-btn{
    width:100%; padding:14px; border:none; border-radius:8px;
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px;
    background:#f2ecdd; color:var(--ink); cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .msg{ font-size:13px; margin-top:8px; min-height:16px; font-weight:600; }
  .msg.ok{ color:#c7f5b8; }
  .msg.err{ color:#ffb8a3; }
  .empty-menu{ text-align:center; color:#5c665f; font-size:12.5px; padding:26px 10px; border:1px dashed var(--line); border-radius:8px; }

  /* Ticket log */
  .log-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .log-head h2{
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:#f2ecdd; margin:0;
  }
  .log-actions{ display:flex; gap:8px; }
  .log-actions button{
    background:transparent; border:1px solid var(--line); color:var(--steel);
    padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters select{ margin:0; flex:1; min-width:110px;}

  .ticket-roll{ display:flex; flex-direction:column; gap:10px; }
  .ticket{
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 12px 14px 10px;
    position:relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute; left:0; right:0; height:6px;
    background: radial-gradient(circle, var(--bg) 4px, transparent 4.5px);
    background-size: 12px 12px; background-position: -2px center;
  }
  .ticket::before{ top:-3px; }
  .ticket::after{ bottom:-3px; }
  .ticket-top{
    display:flex; justify-content:space-between; font-size:11px;
    border-bottom:1px dashed var(--paper-2); padding-bottom:6px; margin-bottom:6px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .ticket-meta{ font-size:12px; margin-bottom:6px; }
  .prep-status{ font-size:11px; color:#6b6250; padding:0 0 3px 18px; }
  .ticket-meta b{ color:var(--ink); }
  .ticket-items{ font-size:12px; }
  .ticket-item-line{ display:flex; justify-content:space-between; padding:1px 0; }
  .ticket-item-line .cat{ display:inline-block; width:14px; font-weight:700; }
  .ticket-del{
    position:absolute; top:8px; right:8px; background:none; border:none;
    color:#8a8272; font-size:14px; cursor:pointer;
  }
  .empty{ text-align:center; color:#5c665f; font-size:12px; padding:30px 0; }
  .footnote{ font-size:10px; color:#5c665f; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>KITCHEN PRODUCTIVITY</h1>
  <div class="sub">NS KITCHEN — PREP TRACKING LOG</div>

  <div class="panel">
    <div class="row2">
      <div>
        <label>Person</label>
        <select id="persona"></select>
      </div>
      <div>
        <label>Date and time</label>
        <input type="text" id="fechaHora" readonly>
      </div>
    </div>

    <label>Menu</label>
    <select id="menuSelect"></select>

    <label>Meals</label>
    <div class="meals-grid" id="mealsGrid"></div>
    <div id="menuBody"></div>

    <label id="comentarioLabel">Comment (optional)</label>
    <textarea id="comentario" rows="2" placeholder="E.g.: box opened, leftover from event..."></textarea>

    <button class="submit-btn" id="submitBtn">SUBMIT</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <div class="log-head">
      <h2>RECORDS</h2>
      <div class="log-actions">
        <button id="exportBtn">EXPORT CSV</button>
      </div>
    </div>
    <div class="filters">
      <select id="fPersona"><option value="">Any person</option></select>
      <select id="fMenu"><option value="">Any menu</option></select>
    </div>
    <div class="legend">
      <span><i style="background:var(--c-carb)"></i>C · Carbohydrate</span>
      <span><i style="background:var(--c-veg)"></i>V · Vegetable</span>
      <span><i style="background:var(--c-prot)"></i>P · Protein</span>
      <span><i style="background:var(--c-sauce)"></i>S · Salsa</span>
    </div>
    <div class="footnote" style="margin-bottom:12px;">Default unit: LB · Sauces: BINS · Wings / Turkey Burger / Hamburger: UNITS</div>
    <div class="ticket-roll" id="ticketRoll"></div>
    <div class="footnote">Records are saved in the cloud and are visible to everyone on the team using this app.</div>
  </div>
</div>

let currentMenuNum = 1;
let currentMeal = 1;
let entries = [];

const personaSel = document.getElementById('persona');
const menuSelect = document.getElementById('menuSelect');
const mealsGrid = document.getElementById('mealsGrid');
const menuBody = document.getElementById('menuBody');
const fechaHoraInput = document.getElementById('fechaHora');
const msgEl = document.getElementById('msg');
const ticketRoll = document.getElementById('ticketRoll');
const fPersona = document.getElementById('fPersona');
const fMenu = document.getElementById('fMenu');

function updateFechaHora(){
  const now = new Date();
  fechaHoraInput.value = now.toLocaleDateString('es-US') + ' ' + now.toLocaleTimeString('es-US', {hour:'2-digit', minute:'2-digit'});
}
updateFechaHora();
setInterval(updateFechaHora, 30000);

function renderPersonas(){
  personaSel.innerHTML = PERSONAS.map(p => `<option value="${p}">${p}</option>`).join('');
}

function renderMenuSelect(){
  menuSelect.innerHTML = Object.keys(MENUS).map(k =>
    `<option value="${k}" ${+k===currentMenuNum?'selected':''}>MENU ${k}${MENUS[k] ? '' : ' (sin datos)'}</option>`
  ).join('');
}

function renderMealsGrid(){
  const menu = MENUS[currentMenuNum];
  mealsGrid.innerHTML = [1,2,3,4,5].map(m => {
    const disabled = !menu;
    return `<button data-meal="${m}" class="${m===currentMeal?'active':''}" ${disabled?'disabled':''}>MEAL ${m}</button>`;
  }).join('');
  [...mealsGrid.querySelectorAll('button')].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMeal = +btn.dataset.meal;
      renderMealsGrid();
      renderMenuBody();
    });
  });
}

function getUnit(cat, name){
  const n = name.toUpperCase();
  if(cat === 'S') return 'BINES';
  if(n.includes('WING') || n.includes('TURKEY BURGER') || n.includes('HAMBURGER')) return 'UND';
  return 'LB';
}

function renderMenuBody(){
  const menu = MENUS[currentMenuNum];
  if(!menu){
    menuBody.innerHTML = `<div class="empty-menu">MENU ${currentMenuNum} doesn't have any dishes loaded yet.<br>Send me the info for its 5 meals and I'll add it.</div>`;
    return;
  }
  const meal = menu.meals[currentMeal];
  const rows = meal.items.map((it, idx) => {
    const unit = getUnit(it.cat, it.name);
    const showPrep = (it.cat === 'C' || it.cat === 'V' || it.cat === 'P');
    return `
    <div class="item-row" data-idx="${idx}">
      <div class="item-top">
        <div class="badge ${it.cat}">${it.cat}</div>
        <div class="item-name">${it.name}</div>
        <input type="number" min="0" step="0.1" placeholder="${unit}" data-cat="${it.cat}" data-name="${it.name}" data-unit="${unit}">
      </div>
      ${showPrep ? `
      <div class="prep-row">
        <label class="prep-check"><input type="checkbox" data-prep="cut">CUT</label>
        <label class="prep-check"><input type="checkbox" data-prep="season">SEASON</label>
        <label class="prep-check"><input type="checkbox" data-prep="cook">COOK</label>
      </div>` : ''}
    </div>
  `;}).join('');
  menuBody.innerHTML = `<div class="menu-title">MENU ${currentMenuNum} · MEAL ${currentMeal} · ${meal.name}</div>${rows}`;
}

menuSelect.addEventListener('change', ()=>{
  currentMenuNum = +menuSelect.value;
  currentMeal = 1;
  renderMealsGrid();
  renderMenuBody();
});

function showMsg(text, ok=true){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(()=>{ msgEl.textContent=''; }, 6000);
}

async function loadEntries(){
  try{
    const res = await window.storage.get('kitchen-productivity-entries', true);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  renderFilters();
  renderTicketRoll();
}

async function saveEntries(){
  try{
    await window.storage.set('kitchen-productivity-entries', JSON.stringify(entries), true);
  }catch(e){
    showMsg('No se pudo guardar en la nube, pero el registro quedó en esta sesión.', false);
  }
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const menu = MENUS[currentMenuNum];
  if(!menu){ showMsg('This menu does not have any dishes loaded yet.', false); return; }
  const meal = menu.meals[currentMeal];
  const persona = personaSel.value;
  const comentario = document.getElementById('comentario').value.trim();
  const itemRows = [...menuBody.querySelectorAll('.item-row')];
  const items = [];
  itemRows.forEach(row=>{
    const inp = row.querySelector('input[type="number"]');
    if(!inp || inp.value === '' || parseFloat(inp.value) <= 0) return;
    const item = { cat: inp.dataset.cat, name: inp.dataset.name, peso: parseFloat(inp.value), unidad: inp.dataset.unit };
    const cutBox = row.querySelector('[data-prep="cut"]');
    if(cutBox){
      item.cut = cutBox.checked;
      item.season = row.querySelector('[data-prep="season"]').checked;
      item.cook = row.querySelector('[data-prep="cook"]').checked;
    }
    items.push(item);
  });

  if(items.length === 0){
    showMsg('Enter at least one quantity before submitting.', false);
    return;
  }

  const entry = {
    id: Date.now(),
    persona,
    menuNum: currentMenuNum,
    mealNum: currentMeal,
    mealName: meal.name,
    fechaHora: fechaHoraInput.value,
    comentario,
    items
  };
  entries.unshift(entry);
  await saveEntries();
  syncToSheets(entry);
  renderFilters();
  renderTicketRoll();
  itemRows.forEach(row=>{
    const inp = row.querySelector('input[type="number"]');
    if(inp) inp.value='';
    row.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=false);
  });
  document.getElementById('comentario').value='';
  showMsg('Thank you for your help and honest work, Blessings. MR');
});

// Envía el registro al Google Sheet (si SHEET_WEBAPP_URL está configurada).
// No bloquea la interfaz: si falla o no está configurada, el registro local no se pierde.
function syncToSheets(entry){
  if(!SHEET_WEBAPP_URL) return;
  fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(entry)
  }).catch(()=>{ /* if there's no internet, the entry is already saved locally */ });
}

function renderFilters(){
  const personas = [...new Set(entries.map(e=>e.persona))].sort();
  const menus = [...new Set(entries.map(e=>e.menuNum))].sort((a,b)=>a-b);
  const curP = fPersona.value, curM = fMenu.value;
  fPersona.innerHTML = '<option value="">Any person</option>' + personas.map(p=>`<option value="${p}">${p}</option>`).join('');
  fMenu.innerHTML = '<option value="">Any menu</option>' + menus.map(m=>`<option value="${m}">MENU ${m}</option>`).join('');
  fPersona.value = curP; fMenu.value = curM;
}

[fPersona, fMenu].forEach(el => el.addEventListener('change', renderTicketRoll));

function renderTicketRoll(){
  const filtered = entries.filter(e=>{
    if(fPersona.value && e.persona !== fPersona.value) return false;
    if(fMenu.value && String(e.menuNum) !== fMenu.value) return false;
    return true;
  });

  if(filtered.length === 0){
    ticketRoll.innerHTML = '<div class="empty">No records yet. The first chit will show up here.</div>';
    return;
  }

  ticketRoll.innerHTML = filtered.map(e => `
    <div class="ticket" data-id="${e.id}">
      <button class="ticket-del" title="Eliminar">✕</button>
      <div class="ticket-top">
        <span></span>
        <span>${e.fechaHora}</span>
      </div>
      <div class="ticket-meta"><b>${e.persona}</b> — MENU ${e.menuNum} · MEAL ${e.mealNum} · ${e.mealName}</div>
      <div class="ticket-items">
        ${e.items.map(it => `
          <div class="ticket-item-line"><span><span class="cat">${it.cat}</span>${it.name}</span><span>${it.peso} ${(it.unidad||'LB').toLowerCase()}</span></div>
          ${it.cut!==undefined ? `<div class="prep-status">CUT ${it.cut?'✓':'—'} · SEASON ${it.season?'✓':'—'} · COOK ${it.cook?'✓':'—'}</div>` : ''}
        `).join('')}
      </div>
      ${e.comentario ? `<div class="ticket-meta">Note: ${e.comentario}</div>` : ''}
    </div>
  `).join('');

  ticketRoll.querySelectorAll('.ticket-del').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      const id = +ev.target.closest('.ticket').dataset.id;
      entries = entries.filter(e=>e.id !== id);
      await saveEntries();
      renderFilters();
      renderTicketRoll();
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(entries.length === 0){ showMsg('No records to export.', false); return; }
  const header = ['Date_Time','Person','Menu','Meal','Category','Item','Quantity','Unit','Cut','Season','Cook','Comment'];
  const rows = [];
  entries.forEach(e=>{
    e.items.forEach(it=>{
      const cut = it.cut!==undefined ? (it.cut?'YES':'NO') : '';
      const season = it.season!==undefined ? (it.season?'YES':'NO') : '';
      const cook = it.cook!==undefined ? (it.cook?'YES':'NO') : '';
      rows.push([e.fechaHora, e.persona, `MENU ${e.menuNum}`, `MEAL ${e.mealNum} - ${e.mealName}`, it.cat, it.name, it.peso, it.unidad||'LB', cut, season, cook, e.comentario||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    });
  });
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'control_cooler.csv';
  a.click();
  URL.revokeObjectURL(url);
});

renderPersonas();
renderMenuSelect();
renderMealsGrid();
renderMenuBody();
loadEntries();
</script>
